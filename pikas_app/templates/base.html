<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="{% static 'img/pikas-logo-xs.png' %}">
    <title>PIKAS - Performance Indicators</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Nunito Sans -->
    <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Nunito Sans"', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Nunito Sans', sans-serif; }
        [x-cloak] { display: none !important; }
    </style>
</head>
<body class="bg-slate-900 text-slate-200 min-h-screen">
    <!-- Navbar -->
    <nav class="border-b border-slate-700 bg-slate-800">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <a href="/" class="flex-shrink-0 flex items-center gap-2">
                        <img src="{% static 'img/pikas-logo-sm.png' %}" alt="Logo" class="h-8 w-auto">
                        <span class="text-2xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-purple-600 to-pink-600">PIKAS</span>
                    </a>
                </div>
                <div class="flex items-center space-x-4">
                    {% if config %}
                        <span class="text-sm text-slate-400 font-semibold">Tahun: {{ config.active_year }} | Q{{ config.active_quarter }}</span>
                        {% if config.is_locked %}
                            <span class="px-2 py-1 text-xs font-semibold rounded bg-red-900 text-red-200 border border-red-700 shadow-lg">LOCKED</span>
                        {% else %}
                            <span class="px-2 py-1 text-xs font-semibold rounded bg-green-900 text-green-200 border border-green-700 shadow-lg">ACTIVE</span>
                        {% endif %}
                    {% else %}
                        <span class="px-2 py-1 text-xs font-semibold rounded bg-orange-900 text-orange-200 border border-orange-700">NO CONFIG</span>
                    {% endif %}
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
