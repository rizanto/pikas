{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="{% static 'img/pikas-logo-xs.png' %}">
    <title>Login - PIKAS</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:ital,opsz,wght@0,6..12,200..1000;1,6..12,200..1000&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Nunito Sans', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #050816;
            overflow: hidden;
            position: relative;
        }

        /* ===== Dynamic Aurora Background ===== */
        .aurora-container {
            position: fixed; inset: 0; z-index: 0; overflow: hidden;
            background: radial-gradient(ellipse at 50% 100%, #0a0f24 0%, #050816 100%);
        }
        .aurora-blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.35;
            animation: auroraFloat 12s ease-in-out infinite alternate;
        }
        .aurora-blob:nth-child(1) {
            width: 600px; height: 400px;
            background: linear-gradient(135deg, #7c3aed, #a855f7);
            top: -15%; left: -10%;
            animation-duration: 14s;
        }
        .aurora-blob:nth-child(2) {
            width: 500px; height: 500px;
            background: linear-gradient(135deg, #ec4899, #f472b6);
            top: 10%; right: -15%;
            animation-duration: 18s;
            animation-delay: -4s;
        }
        .aurora-blob:nth-child(3) {
            width: 700px; height: 350px;
            background: linear-gradient(135deg, #6366f1, #818cf8);
            bottom: -20%; left: 20%;
            animation-duration: 16s;
            animation-delay: -8s;
        }
        .aurora-blob:nth-child(4) {
            width: 400px; height: 400px;
            background: linear-gradient(135deg, #a855f7, #ec4899);
            top: 40%; left: 50%;
            animation-duration: 20s;
            animation-delay: -2s;
            opacity: 0.2;
        }
        @keyframes auroraFloat {
            0%   { transform: translate(0, 0) scale(1) rotate(0deg); }
            33%  { transform: translate(60px, -40px) scale(1.15) rotate(5deg); }
            66%  { transform: translate(-40px, 30px) scale(0.9) rotate(-3deg); }
            100% { transform: translate(20px, -20px) scale(1.05) rotate(2deg); }
        }

        /* Grid overlay for depth */
        .aurora-container::after {
            content: '';
            position: absolute; inset: 0;
            background-image: radial-gradient(circle at 1px 1px, rgba(255,255,255,0.015) 1px, transparent 0);
            background-size: 40px 40px;
        }

        /* ===== Glass Card ===== */
        .glass-card {
            position: relative; z-index: 10;
            width: 100%; max-width: 400px;
            padding: 36px 32px;
            background: rgba(15, 23, 42, 0.55);
            backdrop-filter: blur(40px) saturate(1.5);
            -webkit-backdrop-filter: blur(40px) saturate(1.5);
            border: 1px solid rgba(148, 163, 184, 0.12);
            border-radius: 20px;
            box-shadow:
                0 0 0 1px rgba(255,255,255,0.03) inset,
                0 32px 64px -12px rgba(0,0,0,0.6),
                0 0 120px -20px rgba(139, 92, 246, 0.15);
        }

        /* Logo */
        .logo-text {
            font-size: 30px; font-weight: 900; letter-spacing: -1px;
            background: linear-gradient(135deg, #c084fc, #f472b6, #818cf8);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .logo-sub { color: #94a3b8; font-size: 13px; margin-top: 6px; font-weight: 600; }

        /* Error alert */
        .error-alert {
            background: rgba(220, 38, 38, 0.12);
            border: 1px solid rgba(220, 38, 38, 0.3);
            border-radius: 12px; padding: 12px 16px;
            color: #fca5a5; font-size: 13px; font-weight: 600;
            margin-bottom: 24px;
            display: flex; align-items: center; gap: 10px;
        }

        /* Form */
        .form-group { margin-bottom: 20px; }
        .form-label {
            display: block; font-size: 13px; font-weight: 700;
            color: #cbd5e1; margin-bottom: 8px; letter-spacing: 0.3px;
        }
        .form-input-wrapper {
            position: relative;
        }
        .form-icon {
            position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
            width: 18px; height: 18px; color: #475569;
            pointer-events: none; transition: color 0.2s;
        }
        .form-input {
            width: 100%;
            padding: 14px 16px 14px 44px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(71, 85, 105, 0.4);
            border-radius: 12px;
            color: #e2e8f0;
            font-size: 14px; font-weight: 600;
            font-family: 'Nunito Sans', sans-serif;
            outline: none;
            transition: all 0.3s ease;
        }
        .form-input::placeholder { color: #475569; }
        .form-input:focus {
            border-color: rgba(168, 85, 247, 0.6);
            box-shadow: 0 0 0 3px rgba(168, 85, 247, 0.12), 0 0 20px -4px rgba(168, 85, 247, 0.15);
            background: rgba(15, 23, 42, 0.8);
        }
        .form-input:focus + .form-icon,
        .form-input-wrapper:focus-within .form-icon { color: #a855f7; }

        .form-input:-webkit-autofill,
        .form-input:-webkit-autofill:hover, 
        .form-input:-webkit-autofill:focus {
            -webkit-box-shadow: 0 0 0px 1000px #0f172a inset !important;
            -webkit-text-fill-color: #f1f5f9 !important;
            transition: background-color 5000s ease-in-out 0s;
        }

        /* Submit Button */
        .btn-submit {
            width: 100%; padding: 14px;
            background: linear-gradient(135deg, #7c3aed, #a855f7, #ec4899);
            background-size: 200% 200%;
            animation: gradientShift 4s ease infinite;
            border: none; border-radius: 14px;
            color: white; font-size: 15px; font-weight: 800;
            font-family: 'Nunito Sans', sans-serif;
            cursor: pointer; position: relative; overflow: hidden;
            transition: all 0.3s ease;
            box-shadow: 0 8px 32px -8px rgba(168, 85, 247, 0.5);
            letter-spacing: 0.5px;
        }
        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 40px -8px rgba(168, 85, 247, 0.65);
        }
        .btn-submit:active { transform: translateY(0); }
        .btn-submit:disabled { opacity: 0.7; cursor: wait; }

        @keyframes gradientShift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        /* Spinner */
        .spinner {
            display: inline-block; width: 18px; height: 18px;
            border: 2.5px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            vertical-align: middle; margin-right: 8px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Ambient glow under card */
        .card-glow {
            position: absolute; bottom: -40px; left: 50%; transform: translateX(-50%);
            width: 80%; height: 80px;
            background: radial-gradient(ellipse, rgba(168,85,247,0.15) 0%, transparent 70%);
            filter: blur(30px); z-index: 5;
        }
    </style>
</head>
<body>
    <div class="aurora-container">
        <div class="aurora-blob"></div>
        <div class="aurora-blob"></div>
        <div class="aurora-blob"></div>
        <div class="aurora-blob"></div>
    </div>

    <div class="card-glow"></div>

    <div class="glass-card">
        <div style="text-align:center; margin-bottom: 28px;">
            <img src="{% static 'img/pikas-logo-lg.png' %}" alt="Logo" style="width:100px; height:100px; object-fit:contain; margin-bottom:10px;">
            <div class="logo-text">PIKAS</div>
            <div style="color: #94a3b8; font-size: 11px; margin-top: 4px; font-weight: 600; line-height: 1.5;">Performance Indicators Knowledgebase<br>Accountability System</div>
        </div>

        {% if error %}
        <div class="error-alert">
            <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
            {{ error }}
        </div>
        {% endif %}

        <form method="POST" action="{% url 'login' %}" id="loginForm">
            {% csrf_token %}
            <div class="form-group">
                <label class="form-label">Username</label>
                <div class="form-input-wrapper">
                    <input type="text" name="username" class="form-input" placeholder="Masukkan username" required autocomplete="username">
                    <svg class="form-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">Password</label>
                <div class="form-input-wrapper">
                    <input type="password" name="password" class="form-input" placeholder="••••••••" required autocomplete="current-password">
                    <svg class="form-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
                </div>
            </div>

            <div style="margin-top: 28px;">
                <button type="submit" class="btn-submit" id="submitBtn">
                    Sign In
                </button>
            </div>
        </form>

        <div style="margin-top: 24px; padding-top: 20px; border-top: 1px solid rgba(148,163,184,0.08); text-align: center;">
            <div style="font-size: 9px; font-weight: 800; color: rgba(148,163,184,0.3); text-transform: uppercase; letter-spacing: 2px; margin-bottom: 4px;">Portal PIKAS</div>
            <div style="font-size: 12px; font-weight: 700; color: #64748b; letter-spacing: 0.5px;">{{ satker_name }}</div>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function() {
            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner"></span> Authenticating...';
        });
    </script>
</body>
</html>
